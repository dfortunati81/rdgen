
name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: false
        type: string

jobs:
  download-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Restore encrypted AJW configuration
        shell: bash
        env:
          AJW_CONFIG_ZIP_B64: ${{ secrets.AJW_CONFIG_ZIP_B64 }}
        run: |
          if [ -z "$AJW_CONFIG_ZIP_B64" ]; then
            echo "::error::AJW_CONFIG_ZIP_B64 secret is missing"
            exit 1
          fi

          printf '%s' "$AJW_CONFIG_ZIP_B64" | base64 --decode > secrets.zip

          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          path = Path("secrets.zip")
          data = path.read_bytes()

          if not data.startswith(b"PK"):
              raise SystemExit("Invalid ZIP file signature")

          if not zipfile.is_zipfile(path):
              raise SystemExit("Invalid ZIP file structure")

          print("Encrypted ZIP restored successfully")
          PY

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
