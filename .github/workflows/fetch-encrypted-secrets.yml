
name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: false
        type: string

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Restore encrypted AJW configuration
        shell: bash
        env:
          AJW_CONFIG_ZIP_B64: ${{ secrets.AJW_CONFIG_ZIP_B64 }}
        run: |
          if [ -z "$AJW_CONFIG_ZIP_B64" ]; then
            echo "::error::AJW_CONFIG_ZIP_B64 secret is missing"
            exit 1
          fi

          printf '%s' "$AJW_CONFIG_ZIP_B64" | base64 --decode > secrets.zip

          python3 -c "from pathlib import Path; data = Path('secrets.zip').read_bytes(); assert data.startswith(b'PK'), 'Invalid ZIP file'; print('Encrypted ZIP restored successfully')""

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
