
name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: true
        type: string

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted configuration ZIP
        env:
          ZIP_URL_INPUT: ${{ inputs.zip_url_json }}
        shell: python
        run: |
          import json
          import time
          import urllib.request
          from urllib.parse import urlparse

          raw = __import__("os").environ["ZIP_URL_INPUT"].strip()

          if raw.startswith("{"):
              config = json.loads(raw)
              url = (
                  config["url"].rstrip("/")
                  + "/get_zip?filename="
                  + config["file"]
              )
          else:
              url = raw

          parsed = urlparse(url)
          if parsed.scheme != "https":
              raise ValueError("An HTTPS download URL is required")

          for attempt in range(5):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "AJW-RDGen-Builder"}
                  )
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      content = response.read()

                  if not content.startswith(b"PK"):
                      raise ValueError(
                          "Downloaded content is not a ZIP file"
                      )

                  with open("secrets.zip", "wb") as file:
                      file.write(content)

                  print("Encrypted ZIP downloaded successfully")
                  break

              except Exception:
                  if attempt == 4:
                      raise
                  time.sleep(5 * (attempt + 1))

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
