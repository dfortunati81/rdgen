
name: 'Decrypt and Mask Secrets'
description: 'Decrypts a zip and masks the JSON contents as env vars'

inputs:
  zip_password:
    description: 'Password for the Zip'
    required: true
  approval_mode:
    description: 'Optional AJW attended-support approval override'
    required: false
    default: ''
  zip_path:
    description: 'Path to the encrypted zip'
    required: false
    default: 'secrets.zip'

runs:
  using: "composite"
  steps:
    - name: Install Python dependencies
      shell: bash
      run: |
        pip install pyzipper

    - name: Decrypt and Mask
      shell: python
      env:
        ZIP_PASSWORD: ${{ inputs.zip_password }}
        AJW_APPROVAL_MODE: ${{ inputs.approval_mode }}
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
      run: |
        import sys
        import io
        import pyzipper
        import json
        import os
        import base64

        # Force UTF-8 output on Windows runners
        sys.stdout = io.TextIOWrapper(
            sys.stdout.buffer,
            encoding="utf-8",
            errors="replace"
        )

        sys.stderr = io.TextIOWrapper(
            sys.stderr.buffer,
            encoding="utf-8",
            errors="replace"
        )

        # Decrypt the AES-encrypted configuration ZIP
        with pyzipper.AESZipFile(
            '${{ inputs.zip_path }}'
        ) as zf:

            password = os.environ['ZIP_PASSWORD']
            zf.setpassword(password.encode('utf-8'))

            with zf.open('secrets.json') as f:
                secrets = json.load(f)


        # Opt in only from the client workflows being changed.
        if os.environ.get('AJW_APPROVAL_MODE') == 'click':
            custom = json.loads(base64.b64decode(secrets['custom']))
            if custom.get('conn-type') != 'incoming':
                raise ValueError('AJW support client must be incoming-only')
            if custom.get('disable-installation') != 'Y':
                raise ValueError('AJW support client installation must stay disabled')
            options = custom.setdefault('override-settings', {})
            options['approve-mode'] = 'click'
            options['allow-logon-screen-password'] = 'N'
            custom['disable-settings'] = 'Y'
            secrets['custom'] = base64.b64encode(
                json.dumps(custom, separators=(',', ':')).encode('utf-8')
            ).decode('ascii')
            print('Applied click-only approval for the attended support client.')

        # Mask configuration values and export them
        # to the GitHub Actions environment
        with open(
            os.environ['GITHUB_ENV'],
            'a',
            encoding='utf-8'
        ) as env_file:

            for key, value in secrets.items():
                if value:
                    value = str(value)

                    print(f"::add-mask::{value}")

                    env_file.write(
                        f"{key}={value}\n"
                    )

        print(
            f"Successfully masked {len(secrets)} secrets."
        )
