
name: 'Decrypt and Mask Secrets'
description: 'Decrypts a zip and masks the JSON contents as env vars'

inputs:
  zip_password:
    description: 'Password for the Zip'
    required: true
  zip_path:
    description: 'Path to the encrypted zip'
    required: false
    default: 'secrets.zip'

runs:
  using: "composite"
  steps:
    - name: Install Python dependencies
      shell: bash
      run: |
        pip install pyzipper

    - name: Decrypt and Mask
      shell: python
      env:
        ZIP_PASSWORD: ${{ inputs.zip_password }}
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
      run: |
        import sys
        import io
        import pyzipper
        import json
        import os

        # Force UTF-8 output on Windows runners
        sys.stdout = io.TextIOWrapper(
            sys.stdout.buffer,
            encoding="utf-8",
            errors="replace"
        )

        sys.stderr = io.TextIOWrapper(
            sys.stderr.buffer,
            encoding="utf-8",
            errors="replace"
        )

        # Decrypt the AES-encrypted configuration ZIP
        with pyzipper.AESZipFile(
            '${{ inputs.zip_path }}'
        ) as zf:

            password = os.environ['ZIP_PASSWORD']
            zf.setpassword(password.encode('utf-8'))

            with zf.open('secrets.json') as f:
                secrets = json.load(f)

        # Mask configuration values and export them
        # to the GitHub Actions environment
        with open(
            os.environ['GITHUB_ENV'],
            'a',
            encoding='utf-8'
        ) as env_file:

            for key, value in secrets.items():
                if value:
                    value = str(value)

                    print(f"::add-mask::{value}")

                    env_file.write(
                        f"{key}={value}\n"
                    )

        print(
            f"Successfully masked {len(secrets)} secrets."
        )
